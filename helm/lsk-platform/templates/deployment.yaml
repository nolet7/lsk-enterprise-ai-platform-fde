apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: lsk-platform}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: lsk-platform}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lsk-platform}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: "{{ .Values.image.repository }}@{{ required "Pinned image digest required" .Values.image.digest }}"
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 18743}]
        env:
        - {name: REQUIRE_AUTH, value: "true"}
        - {name: OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }}}
        - {name: OIDC_AUDIENCE, value: {{ .Values.oidc.audience | quote }}}
        - {name: MODEL_BASE_URL, value: {{ .Values.model.baseUrl | quote }}}
        - {name: MODEL_NAME, value: {{ .Values.model.name | quote }}}
        - name: MODEL_API_KEY
          valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: model-api-key}}
        - {name: DB_PATH, value: "/tmp/lsk-platform.db"}
        readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
        volumeMounts: [{name: temporary, mountPath: /tmp}]
      volumes: [{name: temporary, emptyDir: {}}]
