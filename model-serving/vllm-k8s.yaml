# Reference only: requires GPU node pool, NVIDIA device plugin, model license and image pinning.
apiVersion: apps/v1
kind: Deployment
metadata: {name: lsk-vllm, namespace: lsk-ai}
spec:
  replicas: 1
  selector: {matchLabels: {app: lsk-vllm}}
  template:
    metadata: {labels: {app: lsk-vllm}}
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.8.5
        args: ["--model","Qwen/Qwen2.5-7B-Instruct","--host","0.0.0.0","--port","8000"]
        ports: [{containerPort: 8000}]
        resources:
          requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: "1"}
          limits: {memory: 32Gi, nvidia.com/gpu: "1"}
---
apiVersion: v1
kind: Service
metadata: {name: lsk-vllm, namespace: lsk-ai}
spec:
  selector: {app: lsk-vllm}
  ports: [{port: 8000, targetPort: 8000}]
