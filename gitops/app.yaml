apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: lsk-platform, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/nolet7/lsk-enterprise-ai-platform-fde.git
    targetRevision: production
    path: helm/lsk-platform
    helm:
      valueFiles: [values.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: lsk-ai}
  syncPolicy:
    syncOptions: [CreateNamespace=true]
# Deliberately NO auto sync until security gates and digest/value overrides are reviewed.
