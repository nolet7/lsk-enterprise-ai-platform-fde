<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>LSK Enterprise Developer Portal</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:16px system-ui;max-width:900px;margin:3rem auto;padding:0 1rem;background:#f5f7fb;color:#16243b}article{background:white;padding:1.5rem;margin:1rem 0;border-radius:12px}input,textarea,select,button{padding:.7rem;margin:.3rem 0;display:block;width:100%;box-sizing:border-box}button{background:#165bd6;color:white;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>LSK Commercial IT Portal</h1><p>Legacy request processing with optional AI assistance. POC is not production authenticated.</p><article><h2>Application registry</h2><pre id="apps"></pre></article><article><h2>Open support ticket (legacy)</h2><input id="requester" placeholder="requester" value="demo-user"><input id="category" placeholder="category" value="delivery"><textarea id="detail" placeholder="Issue details"></textarea><button onclick="ticket()">Create ticket</button><pre id="ticket_result"></pre></article><article><h2>Request application deployment (legacy)</h2><input id="app_id" value="crm"><input id="environment" value="dev"><button onclick="deploy()">Request deployment</button><pre id="deploy_result"></pre></article><article><h2>AI assistant (real inference only)</h2><select id="agent"><option value="support">Customer support RAG</option><option value="procurement">Procurement assistant</option></select><textarea id="question">What is the invoice dispute process?</textarea><button onclick="chat()">Ask assistant</button><pre id="answer"></pre></article><script>
async function req(path,payload){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});return await r.json()}
fetch("/api/apps").then(x=>x.json()).then(x=>apps.textContent=JSON.stringify(x,null,2))
async function ticket(){ticket_result.textContent=JSON.stringify(await req("/api/tickets",{requester:requester.value,category:category.value,detail:detail.value}),null,2)}
async function deploy(){deploy_result.textContent=JSON.stringify(await req("/api/deployments",{app_id:app_id.value,requester:requester.value,environment:environment.value}),null,2)}
async function chat(){answer.textContent=JSON.stringify(await req("/api/agents/chat",{agent_id:agent.value,question:question.value}),null,2)}
</script></body></html>
